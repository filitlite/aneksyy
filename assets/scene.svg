<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="JetBrains Mono, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0810"/>
      <stop offset="1" stop-color="#1b1426"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c93a68"/>
      <stop offset="1" stop-color="#ff5f8f"/>
    </linearGradient>
  </defs>
  <rect width="860" height="640" fill="url(#bg)"/>
  <rect width="860" height="3" fill="url(#acc)"/>
  <rect y="637" width="860" height="3" fill="url(#acc)"/>

  <!-- ======== HEADER ZONE (0..150) ======== -->
  <text x="40" y="52" fill="#ff5f8f" font-size="14" font-weight="700">喰-0- :: fsociety terminal</text>
  <text x="40" y="108" fill="#ffffff" font-size="46" font-weight="700">aneKSYY
    <animate attributeName="opacity" values="1;1;0.35;1;1;1;1" keyTimes="0;0.86;0.9;0.94;0.96;0.98;1" dur="5s" repeatCount="indefinite"/>
  </text>
  <!-- kagune справа от заголовка -->
  <g stroke="url(#acc)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M 300 60 q 26 34 -6 66 q -30 32 8 62 q 32 30 -4 58 q -34 28 6 54" stroke="#ff5f8f">
      <animate attributeName="d"
        values="M 300 60 q 26 34 -6 66 q -30 32 8 62 q 32 30 -4 58 q -34 28 6 54;
                M 300 60 q -24 34 10 66 q 26 32 -10 62 q -28 30 8 54 q 30 28 -8 54;
                M 300 60 q 26 34 -6 66 q -30 32 8 62 q 32 30 -4 58 q -34 28 6 54"
        dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 330 68 q 18 28 -4 56 q -22 28 6 52 q 24 26 -4 48" stroke="#ffd6e3" stroke-width="2" opacity="0.6">
      <animate attributeName="d"
        values="M 330 68 q 18 28 -4 56 q -22 28 6 52 q 24 26 -4 48;
                M 330 68 q -16 28 6 56 q 18 28 -8 52 q -20 26 6 48;
                M 330 68 q 18 28 -4 56 q -22 28 6 52 q 24 26 -4 48"
        dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="40" y="136" fill="#9a8ca6" font-size="13">offensive security · tokyo 20区 · chaotic neutral</text>

  <!-- typing line -->
  <text x="40" y="172" fill="#ff5f8f" font-size="14" font-weight="700">$ </text>
  <text x="62" y="172" fill="#e6dde8" font-size="14">breaking systems to make them stronger
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="4s" repeatCount="indefinite"/>
  </text>
  <line x1="40" y1="192" x2="820" y2="192" stroke="#2e2340" stroke-width="1"/>

  <!-- ======== IDENTITY ZONE (200..330) — левая колонка ======== -->
  <text x="40" y="222" fill="#ff5f8f" font-size="14" font-weight="700">$ cat /etc/identity</text>
  <g font-size="13.5">
    <text x="40" y="256" fill="#e6dde8">handle    : aneksyy   <tspan fill="#5f5370"># 19 y.o.</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.16;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="282" fill="#e6dde8">role      : security researcher · developer · bounty hunter
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.28;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="308" fill="#e6dde8">platform  : Standoff 365 Bug Bounty
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.4;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="334" fill="#e6dde8">alignment : chaotic neutral
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.52;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="360" fill="#e6dde8">hunger    : <tspan fill="#ff5f8f" font-weight="700">critical ☠</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0.7;1" keyTimes="0;0.56;0.64;0.78;0.86;0.9;1" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ======== CONTACT ZONE — правая колонка ======== -->
  <text x="560" y="222" fill="#ff5f8f" font-size="14" font-weight="700">$ ip link</text>
  <g font-size="13.5" fill="#e6dde8">
    <text x="560" y="256">site     : <tspan fill="#ff5f8f">filitlite.github.io/aneksyy</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.68;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="560" y="282">telegram  : <tspan fill="#e6dde8">@aneksyy</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.76;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="560" y="308">standoff  : <tspan fill="#e6dde8">profile/aneksyy</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.84;1" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>
  <!-- рамка контактов -->
  <rect x="548" y="200" width="272" height="122" rx="6" fill="none" stroke="#2e2340"/>

  <line x1="40" y1="392" x2="820" y2="392" stroke="#2e2340" stroke-width="1"/>

  <!-- ======== VECTORS ZONE (410..520) — chips на всю ширину ======== -->
  <text x="40" y="420" fill="#ff5f8f" font-size="14" font-weight="700">$ scan --vectors</text>
  <g font-size="12.5" fill="#e6dde8">
    <g opacity="0.9">
      <rect x="40" y="436" width="64" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="52" y="453">XSS</text>
      <rect x="112" y="436" width="64" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="128" y="453">SQLi</text>
      <rect x="184" y="436" width="64" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="196" y="453">SSRF</text>
      <rect x="256" y="436" width="64" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="274" y="453">IDOR</text>
      <rect x="328" y="436" width="78" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="340" y="453">CSRF</text>
      <rect x="414" y="436" width="112" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="426" y="453">Auth Bypass</text>
      <rect x="534" y="436" width="152" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="546" y="453">Race Conditions</text>
      <rect x="694" y="436" width="126" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="706" y="453">Business Logic</text>

      <rect x="40" y="470" width="152" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="52" y="487">Access Control</text>
      <rect x="200" y="470" width="164" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="212" y="487">Info Disclosure</text>
      <rect x="372" y="470" width="124" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="388" y="487">API Security</text>
      <rect x="504" y="470" width="124" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="522" y="487">Web App Sec</text>

      <!-- бегущий spotlight -->
      <rect x="36" y="432" width="120" height="68" fill="none" stroke="#ff5f8f" stroke-width="1.4" opacity="0.55">
        <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 690 0; 0 0" dur="7s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <line x1="40" y1="516" x2="820" y2="516" stroke="#2e2340" stroke-width="1"/>

  <!-- ======== FOOTER (540..640) ======== -->
  <text x="40" y="552" fill="#ff5f8f" font-size="14" font-weight="700">$ tail -f /var/log/hunger.log</text>
  <text x="40" y="580" fill="#5f5370" font-size="12.5">coffee-driven development · 1000 − 7 · no patch for human</text>
  <text x="40" y="608" fill="#9a8ca6" font-size="12.5">site: <tspan fill="#ffd6e3">filitlite.github.io/aneksyy</tspan></text>
  <!-- мигающий курсор -->
  <rect x="250" y="596" width="9" height="16" fill="#ff5f8f">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- sakura particle -->
  <circle cx="800" cy="570" r="3" fill="#ff5f8f" opacity="0.7">
    <animate attributeName="cy" values="530;610" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="540" r="2.4" fill="#ffd6e3" opacity="0.6">
    <animate attributeName="cy" values="540;620" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="4.2s" repeatCount="indefinite"/>
  </circle>
</svg>
