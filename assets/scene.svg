    <text x="190" y="1103">Access Ctrl</text>
    <rect x="290" y="1084" width="140" height="30" rx="6" fill="#1b1426" stroke="#2e2340"/>
    <text x="360" y="1103">Info Disc.</text>
    <rect x="460" y="1084" width="140" height="30" rx="6" fill="#1b1426" stroke="#2e2340"/>
