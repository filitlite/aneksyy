    <text x="90" y="936" fill="#5f5370" font-size="10.5">frontend · XSS/CSRF · client-side</text>

    <text x="560" y="892" fill="#e6dde8">OSINT &amp; Recon</text>
    <text x="700" y="892" fill="#ff5f8f">86%</text>
    <rect x="560" y="904" width="240" height="8" fill="#08080d" stroke="#2e2340"/>
    <rect x="560" y="904" width="206" height="8" fill="url(#kaku)">
