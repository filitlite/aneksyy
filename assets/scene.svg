    <text x="90" y="892" fill="#e6dde8">HTML / CSS / JS</text>
    <text x="230" y="892" fill="#ff5f8f">84%</text>
    <rect x="90" y="904" width="240" height="8" fill="#08080d" stroke="#2e2340"/>
    <rect x="90" y="904" width="202" height="8" fill="url(#kaku)">
