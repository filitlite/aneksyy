<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1130" viewBox="0 0 880 1130" font-family="JetBrains Mono, Consolas, monospace">
  <defs>
    <radialGradient id="moon" cx="0.42" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#ff9db8"/>
      <stop offset="0.45" stop-color="#e0335c"/>
      <stop offset="0.8" stop-color="#8d0f2b"/>
      <stop offset="1" stop-color="#43060f"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff1f3d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0810"/>
      <stop offset="1" stop-color="#150c1c"/>
    </linearGradient>
    <linearGradient id="kaku" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5f8f"/>
      <stop offset="1" stop-color="#c93a68" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#161020"/>
      <stop offset="1" stop-color="#1b1426"/>
    </linearGradient>
  </defs>

  <rect width="880" height="1130" fill="url(#bg)"/>

  <!-- ================= ЛУНА + КАГУНЭ ================= -->
  <circle cx="440" cy="200" r="230" fill="url(#moonGlow)">
    <animate attributeName="r" values="222;244;222" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="440" cy="200" r="142" fill="url(#moon)">
    <animate attributeName="r" values="140;145;140" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.92;1;0.92" dur="7s" repeatCount="indefinite"/>
  </circle>
  <text x="440" y="228" fill="#30040c" font-size="104" font-weight="900" text-anchor="middle" font-family="'Noto Sans JP',sans-serif">喰</text>

  <g fill="none" stroke="url(#kaku)" stroke-linecap="round">
    <path d="M 330 110 q -60 30 -70 90 q -8 55 -60 70" stroke-width="5" opacity="0.9">
      <animate attributeName="d"
        values="M 330 110 q -60 30 -70 90 q -8 55 -60 70;
                M 330 110 q -72 40 -78 96 q -4 60 -66 80;
                M 330 110 q -60 30 -70 90 q -8 55 -60 70"
        dur="4.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 260 170 q -70 10 -96 60" stroke-width="3.4" opacity="0.7">
      <animate attributeName="d"
        values="M 260 170 q -70 10 -96 60;
                M 260 170 q -80 -6 -104 50;
                M 260 170 q -70 10 -96 60"
        dur="3.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 550 110 q 60 30 70 90 q 8 55 60 70" stroke-width="5" opacity="0.9">
      <animate attributeName="d"
        values="M 550 110 q 60 30 70 90 q 8 55 60 70;
                M 550 110 q 72 40 78 96 q 4 60 66 80;
                M 550 110 q 60 30 70 90 q 8 55 60 70"
        dur="4.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 620 170 q 70 10 96 60" stroke-width="3.4" opacity="0.7">
      <animate attributeName="d"
        values="M 620 170 q 70 10 96 60;
                M 620 170 q 80 -6 104 50;
                M 620 170 q 70 10 96 60"
        dur="3.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 350 300 q -40 50 -110 60" stroke-width="4.4" opacity="0.85">
      <animate attributeName="d"
        values="M 350 300 q -40 50 -110 60;
                M 350 300 q -52 58 -122 66;
                M 350 300 q -40 50 -110 60"
        dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 530 300 q 40 50 110 60" stroke-width="4.4" opacity="0.85">
      <animate attributeName="d"
        values="M 530 300 q 40 50 110 60;
                M 530 300 q 52 58 122 66;
                M 530 300 q 40 50 110 60"
        dur="4.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle r="4" fill="#ff5f8f">
    <animate attributeName="cx" values="290;258;238" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="262;276;292" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.4" fill="#ff5f8f">
    <animate attributeName="cx" values="590;622;642" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="262;276;292" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= НИК ================= -->
  <defs>
    <linearGradient id="nickGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5f8f">
        <animate attributeName="stop-color" values="#ff5f8f;#ff9db8;#c93a68;#ff5f8f" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#ffd6e3">
        <animate attributeName="stop-color" values="#ffd6e3;#ffffff;#ff5f8f;#ffd6e3" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#c93a68">
        <animate attributeName="stop-color" values="#c93a68;#ff5f8f;#ffd6e3;#c93a68" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="nickGlow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="440" y="430" fill="url(#nickGrad)" font-size="74" font-weight="900" text-anchor="middle" letter-spacing="7" filter="url(#nickGlow)">aneksyy
    <animate attributeName="opacity" values="1;1;0.3;1;1" keyTimes="0;0.88;0.93;0.97;1" dur="4.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-5 0;0 0" keyTimes="0;0.88;0.93;0.97;1" dur="4.4s" repeatCount="indefinite"/>
  </text>
  <line x1="280" y1="466" x2="600" y2="466" stroke="#2e2340" stroke-width="1"/>
  <!-- сабтайтл — отдельная зона ниже, три строки -->
  <text x="440" y="500" fill="#e6dde8" font-size="13.5" text-anchor="middle" letter-spacing="2">security researcher</text>
  <text x="440" y="522" fill="#9a8ca6" font-size="12.5" text-anchor="middle" letter-spacing="2">software developer · bug bounty hunter</text>

  

  <!-- ================= МЕНЯЮЩИЕСЯ ФРАЗЫ (без наложений) ================= -->
  <g font-size="18" text-anchor="middle" font-weight="700">
    <text x="440" y="606" fill="#ffffff">нахожу уязвимости, которые
      <tspan fill="#ff5f8f">другие пропускают</tspan>.
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.3;0.33;0.97;0.995;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="440" y="606" fill="#ffffff" opacity="0">пишу код, который
      <tspan fill="#ff5f8f">сложно сломать</tspan>.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.63;0.66;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="440" y="606" fill="#ffffff" opacity="0">breaking systems
      <tspan fill="#ff5f8f">to make them stronger</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.69;0.96;0.99;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>


  


  <!-- ================= СТАТЫ как на сайте ================= -->
  <g text-anchor="middle">
    <rect x="120" y="672" width="160" height="92" rx="6" fill="url(#card)" stroke="#2e2340"/>
    <text x="200" y="716" fill="#ff5f8f" font-size="34" font-weight="900">19
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="200" y="742" fill="#9a8ca6" font-size="11" letter-spacing="2">Y.O. / 年齢</text>

    <rect x="296" y="672" width="160" height="92" rx="6" fill="url(#card)" stroke="#2e2340"/>
    <text x="376" y="716" fill="#ff5f8f" font-size="34" font-weight="900">3</text>
    <text x="376" y="742" fill="#9a8ca6" font-size="11" letter-spacing="2">REPOS</text>

    <rect x="472" y="672" width="160" height="92" rx="6" fill="url(#card)" stroke="#2e2340"/>
    <text x="552" y="716" fill="#ff5f8f" font-size="34" font-weight="900">12</text>
    <text x="552" y="742" fill="#9a8ca6" font-size="11" letter-spacing="2">ATTACK VECTORS</text>

    <rect x="648" y="672" width="160" height="92" rx="6" fill="url(#card)" stroke="#2e2340"/>
    <text x="728" y="716" fill="#ff5f8f" font-size="34" font-weight="900">100</text>
    <text x="728" y="742" fill="#9a8ca6" font-size="11" letter-spacing="2">% OBSESSION</text>
  </g>

  <!-- ================= СКИЛЛЫ: полосы как на сайте ================= -->
