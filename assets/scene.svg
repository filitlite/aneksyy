<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="JetBrains Mono, Consolas, monospace">
  <!-- фон -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0810"/>
      <stop offset="1" stop-color="#1b1426"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c93a68"/>
      <stop offset="1" stop-color="#ff5f8f"/>
    </linearGradient>
  </defs>
  <rect width="860" height="420" fill="url(#bg)"/>
  <rect width="860" height="3" fill="url(#acc)"/>
  <rect y="417" width="860" height="3" fill="url(#acc)"/>

  <!-- титул: печать + мигание -->
  <text x="40" y="66" fill="#ff5f8f" font-size="15" font-weight="700">喰-0- :: fsociety terminal</text>
  <text x="40" y="118" fill="#ffffff" font-size="44" font-weight="700">aneKSYY
    <animate attributeName="opacity" values="1;1;0.35;1;1;1;1" keyTimes="0;0.86;0.9;0.94;0.96;0.98;1" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="40" y="146" fill="#9a8ca6" font-size="13">offensive security · tokyo 20区 · chaotic neutral</text>

  <!-- печатающаяся строка -->
  <text x="40" y="188" fill="#ff5f8f" font-size="14" font-weight="700">$ </text>
  <text x="62" y="188" fill="#e6dde8" font-size="14">
    breaking systems to make them stronger_
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- identity-панель: строки всплывают по очереди -->
  <g font-size="13.5">
    <text x="40" y="232" fill="#e6dde8">handle    : aneksyy          <tspan fill="#5f5370"># 19 y.o.</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.16;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="258" fill="#e6dde8">role      : security researcher · developer · bug bounty hunter
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.28;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="284" fill="#e6dde8">platform  : Standoff 365 Bug Bounty
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.4;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="310" fill="#e6dde8">hunger    : <tspan fill="#ff5f8f" font-weight="700">critical ☠</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1;0.7;1" keyTimes="0;0.44;0.52;0.7;0.8;0.85;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="336" fill="#e6dde8">motto     : <tspan fill="#ffd6e3" font-style="italic">breaking systems to make them stronger</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.64;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- векторы: чипы, поочерёдно подсвечиваются -->
  <g font-size="12.5" fill="#e6dde8">
    <g opacity="0.85">
      <rect x="40" y="358" width="64" height="24" rx="4" fill="#1b1426" stroke="#2e2340"/>
      <text x="52" y="374">XSS</text>
      <rect x="112" y="358" width="64" height="24" rx="4" fill="#1b1426" stroke="#2e2340"/>
      <text x="128" y="374">SQLi</text>
      <rect x="184" y="358" width="64" height="24" rx="4" fill="#1b1426" stroke="#2e2340"/>
      <text x="196" y="374">SSRF</text>
      <rect x="256" y="358" width="64" height="24" rx="4" fill="#1b1426" stroke="#2e2340"/>
      <text x="274" y="374">IDOR</text>
      <rect x="328" y="358" width="78" height="24" rx="4" fill="#1b1426" stroke="#2e2340"/>
      <text x="340" y="374">CSRF</text>
      <rect x="414" y="358" width="108" height="24" rx="4" fill="#1b1426" stroke="#2e2340"/>
      <text x="426" y="374">Auth Bypass</text>
      <rect x="530" y="358" width="146" height="24" rx="4" fill="#1b1426" stroke="#2e2340"/>
      <text x="542" y="374">Race Conditions</text>
      <rect x="684" y="358" width="136" height="24" rx="4" fill="#1b1426" stroke="#2e2340"/>
      <text x="696" y="374">Business Logic</text>
      <rect x="40" y="386" width="150" height="24" rx="4" fill="#1b1426" stroke="#2e2340"/>
      <text x="52" y="402">Access Control</text>
      <rect x="198" y="386" width="160" height="24" rx="4" fill="#1b1426" stroke="#2e2340"/>
      <text x="210" y="402">Info Disclosure</text>
      <rect x="366" y="386" width="120" height="24" rx="4" fill="#1b1426" stroke="#2e2340"/>
      <text x="382" y="402">API Security</text>
      <rect x="494" y="386" width="120" height="24" rx="4" fill="#1b1426" stroke="#2e2340"/>
      <text x="512" y="402">Web App Sec</text>
      <!-- бегущий розовый спотлайт по чипам -->
      <rect x="40" y="358" width="780" height="52" fill="none" stroke="#ff5f8f" stroke-width="1.4" opacity="0.5">
        <animate attributeName="opacity" values="0;0.7;0" dur="3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="-40 0; 240 0; -40 0" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- правая колонка: кагунэ-tentacle живой -->
  <g stroke="url(#acc)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 770 60 q 30 40 -6 78 q -34 36 8 74 q 36 36 -4 70 q -38 34 6 66">
      <animate attributeName="d"
        values="M 770 60 q 30 40 -6 78 q -34 36 8 74 q 36 36 -4 70 q -38 34 6 66;
                M 770 60 q -26 40 10 78 q 30 36 -10 74 q -32 36 8 70 q 34 34 -8 66;
                M 770 60 q 30 40 -6 78 q -34 36 8 74 q 36 36 -4 70 q -38 34 6 66"
        dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 800 70 q 22 34 -4 66 q -26 32 6 62 q 28 30 -4 58" stroke="#ffd6e3" stroke-width="2" opacity="0.6">
      <animate attributeName="d"
        values="M 800 70 q 22 34 -4 66 q -26 32 6 62 q 28 30 -4 58;
                M 800 70 q -18 34 6 66 q 22 32 -8 62 q -24 30 6 58;
                M 800 70 q 22 34 -4 66 q -26 32 6 62 q 28 30 -4 58"
        dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- контакты внизу справа -->
  <g font-size="12" fill="#9a8ca6">
    <text x="630" y="240" fill="#ff5f8f" font-weight="700">$ ip link</text>
    <text x="630" y="266">site     <tspan fill="#e6dde8">filitlite.github.io/aneksyy</tspan></text>
    <text x="630" y="290">telegram  <tspan fill="#e6dde8">@aneksyy</tspan></text>
    <text x="630" y="314">standoff  <tspan fill="#e6dde8">profile/aneksyy</tspan></text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.62;1" dur="6s" repeatCount="indefinite"/>
  </g>
</svg>
