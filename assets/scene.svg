<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" font-family="'Noto Sans JP','JetBrains Mono',sans-serif">
  <defs>
    <radialGradient id="moon" cx="0.42" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#ff9db8"/>
      <stop offset="0.45" stop-color="#e0335c"/>
      <stop offset="0.8" stop-color="#8d0f2b"/>
      <stop offset="1" stop-color="#43060f"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff1f3d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0810"/>
      <stop offset="1" stop-color="#150c1c"/>
    </linearGradient>
    <linearGradient id="kaku" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5f8f"/>
      <stop offset="1" stop-color="#c93a68" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="880" height="620" fill="url(#bg)"/>

  <!-- ============ КРАСНАЯ ЛУНА = центр сцены ============ -->
  <circle cx="440" cy="240" r="240" fill="url(#moonGlow)">
    <animate attributeName="r" values="230;250;230" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="440" cy="240" r="150" fill="url(#moon)">
    <animate attributeName="r" values="148;153;148" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.92;1;0.92" dur="7s" repeatCount="indefinite"/>
  </circle>
  <!-- иероглиф на луне -->
  <text x="440" y="270" fill="#30040c" font-size="110" font-weight="900" text-anchor="middle">喰</text>

  <!-- ============ КАГУНЭ: живёт вокруг луны ============ -->
  <!-- 3 щупальца из-за луны, волнообразные -->
  <g fill="none" stroke="url(#kaku)" stroke-linecap="round">
    <path d="M 320 150 q -60 30 -70 90 q -8 55 -60 70" stroke-width="5" opacity="0.9">
      <animate attributeName="d"
        values="M 320 150 q -60 30 -70 90 q -8 55 -60 70;
                M 320 150 q -72 40 -78 96 q -4 60 -66 80;
                M 320 150 q -60 30 -70 90 q -8 55 -60 70"
        dur="4.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 250 210 q -70 10 -96 60" stroke-width="3.4" opacity="0.7">
      <animate attributeName="d"
        values="M 250 210 q -70 10 -96 60;
                M 250 210 q -80 -6 -104 50;
                M 250 210 q -70 10 -96 60"
        dur="3.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 560 150 q 60 30 70 90 q 8 55 60 70" stroke-width="5" opacity="0.9">
      <animate attributeName="d"
        values="M 560 150 q 60 30 70 90 q 8 55 60 70;
                M 560 150 q 72 40 78 96 q 4 60 66 80;
                M 560 150 q 60 30 70 90 q 8 55 60 70"
        dur="4.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 630 210 q 70 10 96 60" stroke-width="3.4" opacity="0.7">
      <animate attributeName="d"
        values="M 630 210 q 70 10 96 60;
                M 630 210 q 80 -6 104 50;
                M 630 210 q 70 10 96 60"
        dur="3.6s" repeatCount="indefinite"/>
    </path>
    <!-- нижние щупальца -->
    <path d="M 360 360 q -40 50 -110 60" stroke-width="4.4" opacity="0.85">
      <animate attributeName="d"
        values="M 360 360 q -40 50 -110 60;
                M 360 360 q -52 58 -122 66;
                M 360 360 q -40 50 -110 60"
        dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 520 360 q 40 50 110 60" stroke-width="4.4" opacity="0.85">
      <animate attributeName="d"
        values="M 520 360 q 40 50 110 60;
                M 520 360 q 52 58 122 66;
                M 520 360 q 40 50 110 60"
        dur="4.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- капли-частицы с кончиков щупалец -->
  <circle r="4" fill="#ff5f8f">
    <animate attributeName="cx" values="200;170;150" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="315;330;345" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.4" fill="#ff5f8f">
    <animate attributeName="cx" values="680;710;730" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="315;330;345" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#ffd6e3">
    <animate attributeName="cx" values="260;230" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="290;330" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- ============ НИК: крупно под луной ============ -->
  <text x="440" y="470" fill="#ff5f8f" font-size="17" text-anchor="middle" letter-spacing="6" font-weight="700">- 0 -</text>
  <text x="440" y="540" fill="#ffffff" font-size="76" font-weight="900" text-anchor="middle" letter-spacing="10"
    style="text-transform:lowercase">aneksyy
    <animate attributeName="opacity" values="1;1;0.25;1;1" keyTimes="0;0.88;0.93;0.97;1" dur="4.4s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#ffffff;#ffffff;#ff5f8f;#ffffff" keyTimes="0;0.88;0.93;0.97;1" dur="4.4s" repeatCount="indefinite"/>
  </text>
  <text x="440" y="580" fill="#9a8ca6" font-size="15" text-anchor="middle" letter-spacing="3">offensive security · bug bounty · tokyo 20区</text>

  <!-- нижние строки-контакты, по центру -->
  <g font-size="13.5" text-anchor="middle" fill="#e6dde8">
    <text x="440" y="612" opacity="0.9"> Standoff 365 · t.me/<tspan fill="#ffd6e3">aneksyy</tspan> · <tspan fill="#ffd6e3">filitlite.github.io/aneksyy</tspan></text>
  </g>
</svg>
