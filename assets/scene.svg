<svg xmlns="http://www.w3.org/2000/svg" width="880" height="740" viewBox="0 0 880 740" font-family="JetBrains Mono, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0810"/>
      <stop offset="1" stop-color="#181022"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c93a68"/>
      <stop offset="1" stop-color="#ff5f8f"/>
    </linearGradient>
    <linearGradient id="kagune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5f8f"/>
      <stop offset="1" stop-color="#c93a68" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ff8fab"/>
      <stop offset="0.55" stop-color="#c93a68"/>
      <stop offset="1" stop-color="#3d0f1e"/>
    </radialGradient>
  </defs>

  <rect width="880" height="740" fill="url(#bg)"/>
  <rect width="880" height="4" fill="url(#acc)"/>
  <rect y="736" width="880" height="4" fill="url(#acc)"/>

  <!-- красная луна -->
  <circle cx="812" cy="96" r="46" fill="url(#moon)" opacity="0.9">
    <animate attributeName="r" values="46;49;46" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;0.95;0.75" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="796" y="108" fill="#0b0810" font-size="30" font-weight="700">喰</text>

  <!-- ============ ZONE 1: HEADER (0..190) ============ -->
  <text x="48" y="56" fill="#ff5f8f" font-size="14" font-weight="700">喰-0- :: fsociety terminal</text>
  <text x="48" y="118" fill="#ffffff" font-size="50" font-weight="700" letter-spacing="2">aneksyy
    <animate attributeName="opacity" values="1;1;0.3;1;1;1;1" keyTimes="0;0.86;0.9;0.94;0.96;0.98;1" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="48" y="148" fill="#9a8ca6" font-size="13.5">offensive security · tokyo 20区 · chaotic neutral</text>

  <!-- typing line с курсором -->
  <text x="48" y="188" fill="#ff5f8f" font-size="14" font-weight="700">$ </text>
  <text x="72" y="188" fill="#e6dde8" font-size="14">breaking systems to make them stronger
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="4s" repeatCount="indefinite"/>
  </text>
  <line x1="48" y1="208" x2="832" y2="208" stroke="#2e2340" stroke-width="1"/>

  <!-- ============ ZONE 2: IDENTITY | CONTACT (230..430) ============ -->
  <text x="48" y="240" fill="#ff5f8f" font-size="14" font-weight="700">$ cat /etc/identity</text>
  <g font-size="13.5">
    <text x="48" y="276" fill="#e6dde8">handle    : <tspan fill="#ffffff" font-weight="700">aneksyy</tspan>   <tspan fill="#5f5370"># 19 y.o.</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.06;0.14;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="48" y="306" fill="#e6dde8">role      : security researcher
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.24;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="48" y="336" fill="#e6dde8">            developer · bounty hunter
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.3;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="48" y="366" fill="#e6dde8">platform  : Standoff 365 Bug Bounty
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.38;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="48" y="396" fill="#e6dde8">alignment : chaotic neutral
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.46;1" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- контакт-карточка справа -->
  <rect x="520" y="252" width="312" height="164" rx="8" fill="#130e18" stroke="#2e2340"/>
  <rect x="520" y="252" width="3" height="164" fill="url(#acc)"/>
  <text x="548" y="280" fill="#ff5f8f" font-size="13.5" font-weight="700">$ ip link</text>
  <g font-size="13" fill="#e6dde8">
    <text x="548" y="314">site     : <tspan fill="#ffd6e3">aneksyy-site</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.58;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="548" y="346">telegram  : <tspan fill="#ffffff">@aneksyy</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.68;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="548" y="378">standoff  : <tspan fill="#ffffff">profile/aneksyy</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.78;1" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>

  <line x1="48" y1="430" x2="832" y2="430" stroke="#2e2340" stroke-width="1"/>

  <!-- ============ ZONE 3: VECTORS (445..590) ============ -->
  <text x="48" y="458" fill="#ff5f8f" font-size="14" font-weight="700">$ scan --vectors</text>
  <g font-size="12.5" fill="#e6dde8">
    <g>
      <rect x="48" y="474" width="62" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="62" y="491">XSS</text>
      <rect x="118" y="474" width="64" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="134" y="491">SQLi</text>
      <rect x="190" y="474" width="64" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="202" y="491">SSRF</text>
      <rect x="262" y="474" width="64" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="280" y="491">IDOR</text>
      <rect x="334" y="474" width="76" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="346" y="491">CSRF</text>
      <rect x="418" y="474" width="116" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="430" y="491">Auth Bypass</text>
      <rect x="542" y="474" width="158" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="554" y="491">Race Conditions</text>
      <rect x="708" y="474" width="124" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="720" y="491">Business Logic</text>

      <rect x="48" y="508" width="154" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="60" y="525">Access Control</text>
      <rect x="210" y="508" width="166" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="222" y="525">Info Disclosure</text>
      <rect x="384" y="508" width="126" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="400" y="525">API Security</text>
      <rect x="518" y="508" width="126" height="26" rx="5" fill="#1b1426" stroke="#2e2340"/>
      <text x="536" y="525">Web App Sec</text>

      <!-- бегущий spotlight -->
      <rect x="44" y="470" width="130" height="68" fill="none" stroke="#ff5f8f" stroke-width="1.3" opacity="0.5">
        <animate attributeName="opacity" values="0;0.75;0" dur="2.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 700 0; 0 0" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <line x1="48" y1="552" x2="832" y2="552" stroke="#2e2340" stroke-width="1"/>

  <!-- ============ ZONE 4: FOOTER (565..740) ============ -->
  <text x="48" y="586" fill="#ff5f8f" font-size="14" font-weight="700">$ tail -f /var/log/hunger.log</text>
  <text x="48" y="618" fill="#5f5370" font-size="12.5">coffee-driven development · 1000 − 7 · no patch for human</text>
  <text x="48" y="650" fill="#9a8ca6" font-size="12.5">site: <tspan fill="#ffd6e3">filitlite.github.io/aneksyy</tspan></text>
  <rect x="352" y="636" width="9" height="17" fill="#ff5f8f">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- kagune внизу справа: живой -->
  <g stroke="url(#kagune)" fill="none" stroke-linecap="round">
    <path d="M 760 600 q 34 -34 66 0 q 30 32 -6 62 q -34 28 8 56" stroke-width="3">
      <animate attributeName="d"
        values="M 760 600 q 34 -34 66 0 q 30 32 -6 62 q -34 28 8 56;
                M 760 600 q -30 -32 62 -2 q 32 30 -8 60 q -36 30 10 58;
                M 760 600 q 34 -34 66 0 q 30 32 -6 62 q -34 28 8 56"
        dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 800 612 q 22 -22 44 -2 q 22 24 -6 46" stroke="#ffd6e3" stroke-width="2" opacity="0.6">
      <animate attributeName="d"
        values="M 800 612 q 22 -22 44 -2 q 22 24 -6 46;
                M 800 612 q -18 -22 42 -4 q 24 22 -8 44;
                M 800 612 q 22 -22 44 -2 q 22 24 -6 46"
        dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- sakura particles -->
  <circle cx="700" cy="660" r="3" fill="#ff5f8f" opacity="0.7">
    <animate attributeName="cy" values="620;710" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="728" cy="640" r="2.4" fill="#ffd6e3" opacity="0.6">
    <animate attributeName="cy" values="616;714" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="520" r="2" fill="#ff5f8f" opacity="0.5">
    <animate attributeName="cy" values="500;700" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
