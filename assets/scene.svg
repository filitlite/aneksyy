    </rect>
    <rect x="290" y="1008" width="140" height="30" rx="6" fill="none" stroke="#ff5f8f" stroke-width="1.4" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0;0;0" keyTimes="0;0.25;0.35;0.9;1" dur="4.8s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="460" y="1008" width="140" height="30" rx="6" fill="none" stroke="#ff5f8f" stroke-width="1.4" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0;0;0" keyTimes="0;0.25;0.35;0.9;1" dur="4.8s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="630" y="1008" width="140" height="30" rx="6" fill="none" stroke="#ff5f8f" stroke-width="1.4" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0;0;0" keyTimes="0;0.25;0.35;0.9;1" dur="4.8s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="1046" width="140" height="30" rx="6" fill="none" stroke="#ff5f8f" stroke-width="1.4" opacity="0">
